name: Doctor Queue checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-publishable-key

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doctorqueue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d doctorqueue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap minimal Supabase roles and auth schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d doctorqueue -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create table auth.users (
            id uuid primary key,
            email text unique,
            encrypted_password text,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );
          create function auth.uid() returns uuid language sql stable
          as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          grant usage on schema auth to anon, authenticated, service_role;
          grant execute on function auth.uid() to anon, authenticated, service_role;
          grant select on auth.users to authenticated, service_role;
          SQL
      - name: Apply every migration to a clean database
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -h localhost -U postgres -d doctorqueue -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Assert RLS and public grants
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d doctorqueue -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if exists (
              select 1 from pg_class c join pg_namespace n on n.oid=c.relnamespace
              where n.nspname='public' and c.relkind='r' and not c.relrowsecurity
            ) then raise exception 'A public base table is missing RLS'; end if;
            if exists (
              select 1 from pg_class c join pg_namespace n on n.oid=c.relnamespace
              where n.nspname='public' and c.relkind in ('r','v')
                and c.relname <> 'public_queue_snapshots'
                and has_table_privilege('anon',c.oid,'SELECT')
            ) then raise exception 'Anonymous role can read a non-projection table/view'; end if;
            if exists (
              select 1 from pg_class c join pg_namespace n on n.oid=c.relnamespace
              where n.nspname='public' and c.relkind='r'
                and has_table_privilege('authenticated',c.oid,'TRUNCATE')
            ) then raise exception 'Authenticated role has TRUNCATE on a public table'; end if;
            if to_regclass('public.public_queue_status') is not null then raise exception 'Legacy public queue view remains'; end if;
            if to_regprocedure('public.has_clinic_role(uuid,text[])') is not null then raise exception 'RLS helper remains exposed in public schema'; end if;
          end $$;
          SQL

      - name: Test tenant isolation and anonymous privacy with synthetic rows
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d doctorqueue -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          insert into auth.users(id,email,encrypted_password) values
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','tenant-a@example.invalid','synthetic-a'),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','tenant-b@example.invalid','synthetic-b');
          insert into public.clinics(id,clinic_code,name,is_active,is_public) values
            ('aaaaaaaa-0000-4000-8000-000000000001','DQ-TEST-A','Synthetic Clinic A',true,true),
            ('bbbbbbbb-0000-4000-8000-000000000002','DQ-TEST-B','Synthetic Clinic B',true,true);
          insert into public.clinic_memberships(clinic_id,user_id,role,is_active) values
            ('aaaaaaaa-0000-4000-8000-000000000001','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','owner',true),
            ('bbbbbbbb-0000-4000-8000-000000000002','bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','owner',true);
          insert into public.doctors(id,clinic_id,full_name,specialty,is_active,is_public) values
            ('aaaaaaaa-0000-4000-8000-000000000011','aaaaaaaa-0000-4000-8000-000000000001','Synthetic Doctor A','Test',true,true),
            ('bbbbbbbb-0000-4000-8000-000000000022','bbbbbbbb-0000-4000-8000-000000000002','Synthetic Doctor B','Test',true,true);
          insert into public.clinic_hours(clinic_id,doctor_id,weekday,opens_at,closes_at,is_closed)
          values ('aaaaaaaa-0000-4000-8000-000000000001','aaaaaaaa-0000-4000-8000-000000000011',extract(dow from (timezone('Asia/Kolkata',now()))::date)::integer,'00:00','23:59',false);
          insert into public.queues(id,clinic_id,doctor_id,service_date,status,token_prefix,next_token_number,walk_in_enabled) values
            ('aaaaaaaa-0000-4000-8000-000000000111','aaaaaaaa-0000-4000-8000-000000000001','aaaaaaaa-0000-4000-8000-000000000011',(timezone('Asia/Kolkata',now()))::date,'open','A',2,true),
            ('bbbbbbbb-0000-4000-8000-000000000222','bbbbbbbb-0000-4000-8000-000000000002','bbbbbbbb-0000-4000-8000-000000000022',(timezone('Asia/Kolkata',now()))::date,'open','B',2,true);
          insert into public.queue_tokens(id,clinic_id,queue_id,service_date,token_number,display_token,patient_label,patient_phone_hash,status,booking_source) values
            ('aaaaaaaa-0000-4000-8000-000000000111','aaaaaaaa-0000-4000-8000-000000000001','aaaaaaaa-0000-4000-8000-000000000111',current_date,1,'A1','PRIVATE A','SYNTHETIC-HASH-A','waiting','walk_in'),
            ('bbbbbbbb-0000-4000-8000-000000000222','bbbbbbbb-0000-4000-8000-000000000002','bbbbbbbb-0000-4000-8000-000000000222',current_date,1,'B1','PRIVATE B','SYNTHETIC-HASH-B','waiting','walk_in');
          insert into public.appointments(clinic_id,doctor_id,patient_user_id,patient_name,patient_phone_hash,appointment_date,appointment_time,created_by)
          values ('bbbbbbbb-0000-4000-8000-000000000002','bbbbbbbb-0000-4000-8000-000000000022','bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','PRIVATE APPOINTMENT B','SYNTHETIC-HASH-B',current_date,'12:00','bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb');
          set local role authenticated;
          set local request.jwt.claim.sub = 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';
          do $$
          declare n integer; v_appointment_id uuid;
          begin
            select count(*) into n from public.clinic_memberships;
            if n <> 1 then raise exception 'Tenant isolation failed for clinic memberships: % rows',n; end if;
            select count(*) into n from public.queue_tokens;
            if n <> 1 then raise exception 'Tenant isolation failed for queue tokens: % rows',n; end if;
            perform * from public.create_staff_appointment(
              'aaaaaaaa-0000-4000-8000-000000000001','aaaaaaaa-0000-4000-8000-000000000011',null,
              'PRIVATE APPOINTMENT A',(timezone('Asia/Kolkata',now()))::date,'12:00'::time,'tenant-appointment-a'
            );
            select id into v_appointment_id from public.appointments where clinic_id='aaaaaaaa-0000-4000-8000-000000000001' and idempotency_key='tenant-appointment-a';
            perform * from public.transition_staff_appointment(v_appointment_id,'confirm');
            perform * from public.transition_staff_appointment(v_appointment_id,'check_in');
            perform * from public.transition_staff_appointment(v_appointment_id,'complete');
            select count(*) into n from public.appointments;
            if n <> 1 then raise exception 'Tenant isolation failed for appointments: % rows',n; end if;
            select count(*) into n from public.appointments where patient_name='PRIVATE APPOINTMENT B';
            if n <> 0 then raise exception 'Cross-clinic appointment became visible'; end if;
            if has_table_privilege(current_user,'public.queue_tokens','INSERT') then raise exception 'Authenticated role can directly insert tokens'; end if;
            begin
              perform * from public.issue_staff_token('bbbbbbbb-0000-4000-8000-000000000222','UNAUTHORIZED','tenant-isolation-test');
              raise exception 'Cross-clinic token issuance was accepted';
            exception when insufficient_privilege then null;
            end;
          end $$;
          reset role;
          set local role anon;
          do $$
          declare n integer;
          begin
            select count(*) into n from public.public_queue_snapshots where queue_id in
              ('aaaaaaaa-0000-4000-8000-000000000111','bbbbbbbb-0000-4000-8000-000000000222');
            if n <> 2 then raise exception 'Public queue snapshot should show only safe aggregate rows, found %',n; end if;
            if exists (select 1 from public.public_queue_snapshots s where to_jsonb(s) ? 'patient_label' or to_jsonb(s) ? 'patient_phone_hash') then
              raise exception 'Public snapshot exposes private patient fields';
            end if;
          end $$;
          reset role;
          rollback;
          SQL

      - name: Stress concurrent token allocation and idempotency
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d doctorqueue -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users(id,email,encrypted_password)
          values ('cccccccc-cccc-4ccc-8ccc-cccccccccccc','queue-stress@example.invalid','synthetic-stress');
          insert into public.clinics(id,clinic_code,name,is_active,is_public)
          values ('cccccccc-0000-4000-8000-000000000001','DQ-CONC-TEST','Synthetic Concurrency Clinic',true,true);
          insert into public.clinic_memberships(clinic_id,user_id,role,is_active)
          values ('cccccccc-0000-4000-8000-000000000001','cccccccc-cccc-4ccc-8ccc-cccccccccccc','owner',true);
          insert into public.doctors(id,clinic_id,full_name,specialty,is_active,is_public)
          values ('cccccccc-0000-4000-8000-000000000011','cccccccc-0000-4000-8000-000000000001','Synthetic Concurrent Doctor','Test',true,true);
          insert into public.queues(id,clinic_id,doctor_id,service_date,status,token_prefix,next_token_number,walk_in_enabled,max_tokens)
          values ('cccccccc-0000-4000-8000-000000000111','cccccccc-0000-4000-8000-000000000001','cccccccc-0000-4000-8000-000000000011',(timezone('Asia/Kolkata',now()))::date,'open','C',1,true,100);
          insert into public.clinic_settings(clinic_id,settings)
          values ('cccccccc-0000-4000-8000-000000000001','{"subscription":{"limits":{"dailyTokens":100}}}'::jsonb)
          on conflict (clinic_id) do update set settings=excluded.settings;
          SQL
          pids=()
          for i in $(seq 1 20); do
            (
              psql -h localhost -U postgres -d doctorqueue -v ON_ERROR_STOP=1 -q <<SQL >/dev/null
          begin;
          set local role authenticated;
          set local request.jwt.claim.sub = 'cccccccc-cccc-4ccc-8ccc-cccccccccccc';
          select * from public.issue_staff_token('cccccccc-0000-4000-8000-000000000111','Concurrent patient $i','stress-$i');
          commit;
          SQL
            ) &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          test "$failed" -eq 0
          psql -h localhost -U postgres -d doctorqueue -v ON_ERROR_STOP=1 <<'SQL'
          do $check$
          declare n integer; unique_n integer; next_n integer; first_id uuid; second_id uuid;
          begin
            select count(*),count(distinct token_number) into n,unique_n from public.queue_tokens where queue_id='cccccccc-0000-4000-8000-000000000111';
            if n<>20 or unique_n<>20 then raise exception 'Concurrent token allocation produced % rows and % unique numbers',n,unique_n; end if;
            select next_token_number into next_n from public.queues where id='cccccccc-0000-4000-8000-000000000111';
            if next_n<>21 then raise exception 'Expected next token number 21, found %',next_n; end if;
            perform set_config('request.jwt.claim.sub','cccccccc-cccc-4ccc-8ccc-cccccccccccc',true);
            select token_id into first_id from public.issue_staff_token('cccccccc-0000-4000-8000-000000000111','Idempotent patient','same-key');
            select token_id into second_id from public.issue_staff_token('cccccccc-0000-4000-8000-000000000111','Idempotent patient','same-key');
            if first_id is distinct from second_id then raise exception 'Repeated idempotency key allocated multiple tokens'; end if;
            select count(*) into n from public.queue_tokens where queue_id='cccccccc-0000-4000-8000-000000000111';
            if n<>21 then raise exception 'Idempotent repeat created extra token; count=%',n; end if;
          end $check$;
          SQL

